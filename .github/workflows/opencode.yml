# The opencode agent: a comment on an issue or pull request runs it here, on
# GitHub's runner, and it answers with a branch and a pull request.
# Docs: https://opencode.ai/docs/github/ (read 2026-10-22).
#
# TWO TIERS, PICKED BY THE COMMENT (Ian, 2026-10-23: "Luna for Go, nano for
# Zen", and never Luna on a task nano can do):
#   /oc     small, mechanical, literal edits   opencode/gpt-5-nano   (Zen, pay per use)
#   /oc-go  writing and judgement              opencode-go/gpt-6-luna (Go allowance)
# Rule and limits: store:facts/model/github_agent_writes_on_go_claude_haiku.
#
# ONLY IAN'S COMMENTS START IT, so no visitor can spend his allowance.
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  nano:
    if: |
      github.event.comment.user.login == 'iasolb' &&
      contains(github.event.comment.body, '/oc') &&
      !contains(github.event.comment.body, '/oc-go')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/gpt-5-nano

  luna:
    if: |
      github.event.comment.user.login == 'iasolb' &&
      contains(github.event.comment.body, '/oc-go')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/gpt-6-luna
