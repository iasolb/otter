# The opencode agent: a comment containing /oc or /opencode on an issue or pull
# request runs it here, on GitHub's runner, and it answers with a branch and a
# pull request. Docs: https://opencode.ai/docs/github/ (read 2026-10-22).
#
# ONLY IAN'S COMMENTS START IT. The repository is public, so without the
# author check any visitor could spend his opencode allowance.
# The model is a Go one (Ian, 2026-10-23: use the Go allowance he already paid
# for, which does not roll over). Go and Zen share one key, passed under both
# names because which one the opencode-go provider reads is unverified.
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event.comment.user.login == 'iasolb' &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          # Ian, 2026-10-23: Luna on Go, nano on Zen. 21,130 requests a month on Go;
          # kimi-k3 allowed only 490 (opencode.ai/docs/go, 2026-10-23)
          model: opencode-go/gpt-6-luna
