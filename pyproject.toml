[build-system]
# 77 is the floor for the SPDX string form of `license` below. The TOML-table
# form it replaced is deprecated and stops building after 2027-02-18.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "otter"
version = "0.1.3"
description = "A lightweight pandas-based framework for research workflows: dataset management with tracked model specifications, reusable column transforms, and a Monte Carlo simulation module for uncertainty analysis."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ian Solberg" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "geopandas",
    "scipy>=1.11",
    "plotly>=5.18",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/iasolb/otter"
Repository = "https://github.com/iasolb/otter"
Issues = "https://github.com/iasolb/otter/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "duckdb>=1.0"]
# kaleido is plotly's STATIC IMAGE EXPORT backend and this package never
# imports it: `write_image` appears only in docstrings suggesting it to the
# reader. As a hard dependency it pulled choreographer, logistro, orjson and
# simplejson into every install, five packages for a feature nobody is
# required to use. Measured on the 0.1.0 install, 2026-09-11.
plots = ["kaleido>=0.2"]
# create_pool(where="...") runs SQL text through duckdb, pushed down to the
# engine when the source is a duckdb relation. Optional: the callable form
# needs nothing extra.
duckdb = ["duckdb>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

# SHIP THE TYPES (PEP 561). Without py.typed inside the installed package, a
# type checker and an editor both IGNORE every annotation in this library and
# treat it as untyped, so autocomplete gives you nothing and mypy reports it as
# missing stubs. The annotations were already here; nothing told anyone to use
# them.
#
# No .pyi stub files, deliberately. Stubs would restate every signature in a
# second file that then drifts from the first, and this package is annotated
# inline already. One home for one fact.
[tool.setuptools.package-data]
otter = ["py.typed"]
